<header [class.sticky]="!showMenu" class="app-header">
  <div class="app-header__inner">

    @if(isAuthorized){
    <ui-button class="lg" variant="ghost" size="md" (click)="onMenuClick()" aria-label="Open menu">
      ☰
    </ui-button>
    }

    <!-- Brand -->
    <h1 class="app-header__title">
      <a routerLink="/">{{ title }}</a>
    </h1>

    <!-- Search (hidden on xs, grows in middle) -->
    @if(isAuthorized){
    <div class="app-header__search">
      <ui-input size="md" placeholder="Search tickets..." (input)="searchInput.emit($event)" />
    </div>
    }
    <!-- Header actions -->
    <div class="app-header__actions">
      <ui-button class="app-header__request" variant="danger" size="md" (click)="requestAssistance.emit()">
        <span>+</span>
        {{assistanceButtonLabel}}
      </ui-button>
      <ui-button class="app-header__auth" variant="ghost" size="md" (click)="loginClick.emit()">
        {{ isAuthorized ? logoutButtonLabel : loginButtonLabel }}
      </ui-button>
    </div>
  </div>
</header>
