<div class="min-h-[100dvh] bg-ui-bg text-ui-text flex flex-col">
  <app-header title={{title}} (menuClick)="toggleMenu()" (requestAssistance)="assistanceRequestHandler()"
    (loginClick)="loginHandler()" (searchInput)="searchHandler($event)">
  </app-header>

  <app-content *ngIf="authState.isInitialized$ | async; else loading
  " class="flex-1">
    <router-outlet></router-outlet>
  </app-content>

  <app-footer></app-footer>
</div>

<ng-template #loading>
  <div class="flex-1 flex items-center justify-center">
    <p>Loading...</p>
  </div>
</ng-template>
